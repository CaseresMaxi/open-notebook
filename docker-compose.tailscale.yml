# Optional: reach the home server from anywhere through a private Tailscale
# network, with HTTPS and without opening router ports or installing anything
# on the host. Use together with docker-compose.home.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.home.yml -f docker-compose.tailscale.yml up -d
#   docker compose ... logs tailscale   # first run: open the login link
#
# The address is https://${TS_HOSTNAME:-nextnootbook}.<tailnet>.ts.net
services:
  tailscale:
    image: tailscale/tailscale:v1.102.4
    hostname: ${TS_HOSTNAME:-nextnootbook}
    # Host networking lets `serve` reach the UI on 127.0.0.1:8502.
    network_mode: host
    environment:
      - TS_HOSTNAME=${TS_HOSTNAME:-nextnootbook}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale_state:/var/lib/tailscale
      - ./firebase/tailscale-serve.json:/config/serve.json:ro
    restart: always
