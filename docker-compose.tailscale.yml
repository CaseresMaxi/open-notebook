# Optional: reach the home server from anywhere through a private Tailscale
# network, with HTTPS and without opening router ports or installing anything
# on the host. Started by `./nextnootbook remote`.
#
# First run: `./nextnootbook status` prints the sign-in link; it stays valid
# until you approve it (the node waits for login without a deadline).
# Unattended alternative: set TS_AUTHKEY in .env (Tailscale admin → Keys).
#
# The address is https://${TS_HOSTNAME:-nextnootbook}.<tailnet>.ts.net
services:
  tailscale:
    image: tailscale/tailscale:v1.102.4
    hostname: ${TS_HOSTNAME:-nextnootbook}
    # Host networking lets `serve` reach the UI on 127.0.0.1:8502.
    network_mode: host
    environment:
      - TS_HOSTNAME=${TS_HOSTNAME:-nextnootbook}
      - TS_AUTHKEY=${TS_AUTHKEY:-}
    # Not containerboot: it abandons `tailscale up` after 60 s and restarts,
    # which invalidates every sign-in link before it can be approved.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /var/run/tailscale
        tailscaled --tun=userspace-networking --statedir=/var/lib/tailscale &
        until tailscale version >/dev/null 2>&1 && tailscale status --json >/dev/null 2>&1; do sleep 1; done
        tailscale up --hostname="$$TS_HOSTNAME" $${TS_AUTHKEY:+--auth-key="$$TS_AUTHKEY"}
        tailscale serve --bg --https=443 http://127.0.0.1:8502
        echo "serving: https://$$(tailscale status --json | sed -n 's/.*"DNSName": "\([^"]*\)\.".*/\1/p' | head -1)"
        wait
    volumes:
      - tailscale_state:/var/lib/tailscale
    restart: always

volumes:
  tailscale_state:
